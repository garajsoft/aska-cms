name: Push DB schema

on:
  workflow_dispatch:

jobs:
  push-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # yes "" feeds Enter to every drizzle disambiguation prompt, accepting
      # the default '+ create' — without a TTY the push otherwise hangs or
      # silently stops after the first prompt. JITI_TSCONFIG_PATHS makes jiti
      # resolve the '@/' alias used inside src/.
      - run: yes "" | npx jiti scripts/push-schema.ts
        env:
          NODE_ENV: production
          JITI_TSCONFIG_PATHS: "true"
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
